name: TriadLens CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Pylint
        run: python -m pip install pylint==4.1.3
      - name: Check Python errors with Pylint
        run: python -m pylint --errors-only app.py audit.py core.py quantum.py train.py
      - name: Verify JavaScript syntax
        run: node --check static/app.js
      - name: Run public data-free checks
        run: python -m pytest -q tests/test_public.py
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run data-free browser flow
        run: npm run test:e2e:ci
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
  container:
    needs: [test, browser-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build application image
        run: docker build -t triadlens:${{ github.sha }} .
      - name: Check application imports inside image
        run: docker run --rm --entrypoint python triadlens:${{ github.sha }} -c "import app; import audit"
      - name: Confirm private artifacts are absent
        run: |
          docker run --rm --entrypoint sh triadlens:${{ github.sha }} -c \
            'test ! -f /app/models/qml.joblib && test ! -f /app/data/lungcancer.csv && test ! -f /app/reports/metrics.json'
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [test, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Hub destination and credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.' >&2
            exit 1
          fi
          if [[ "$DOCKERHUB_USERNAME" != 'aryanvinju' ]]; then
            echo 'DOCKERHUB_USERNAME must be aryanvinju for this repository.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish source-only image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            aryanvinju/se_miniproj:${{ github.sha }}
            aryanvinju/se_miniproj:latest
